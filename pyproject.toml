[project]
name = "paraketto"
version = "0.1.0"
description = "Speech-to-text with Parakeet TDT 0.6B (V2 English / V3 multilingual) — native CUDA/C++ inference"
requires-python = ">=3.10"
dependencies = [
    "soundfile",
    "numpy",
    "jiwer",
    "requests",
    "onnx",
    "safetensors>=0.4.3",
    "datasets>=4.6.1",
    "whisper-normalizer>=0.1.12",
    "num2words>=0.5.14",
    "scipy>=1.15.3",
]

[dependency-groups]
dev = [
    "librosa>=0.11.0",
    "pyarrow>=23.0.1",
]

